<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원장님 전용 치과 재료 포털</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 650px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; font-weight: bold; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 14px 15px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #3498db; }
        button { padding: 14px 25px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        
        .mall-list { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .mall-list p { margin: 0 0 12px 0; font-weight: bold; color: #7f8c8d; font-size: 14px; }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: #e1f5fe; color: #0288d1; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid #b3e5fc; }
        
        .notice { margin-top: 15px; font-size: 13px; color: #e74c3c; font-weight: bold; text-align: left; background: #fdf2f2; padding: 12px; border-radius: 6px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔎 원장님 전용 치과재료 멀티 검색기</h1>
    
    <div class="search-box">
        <input type="text" id="keyword" placeholder="검색할 재료명을 입력하세요 (예: 레진, 알지네이트)" onkeypress="if(event.keyCode==13) searchAll();">
        <button onclick="searchAll()">10개 몰 동시 검색</button>
    </div>

    <div class="mall-list">
        <p>📊 연동 완료된 치과 쇼핑몰</p>
        <div class="tags">
            <span class="tag">오스템 덴올</span>
            <span class="tag">엠덴트 (메가젠)</span>
            <span class="tag">오브마켓 (덴티스)</span>
            <span class="tag">DVmall (샤인)</span>
            <span class="tag">이덴트</span>
            <span class="tag">덴탈빈 몰</span>
            <span class="tag">덴탈365</span>
            <span class="tag">올소마트</span>
            <span class="tag">미소몰닷컴</span>
        </div>
    </div>

    <div class="notice">
        📌 <b>정상 작동을 위한 안내:</b><br>
        1. 첫 검색 시 주소창 우측의 <u>팝업 차단 창을 꼭 [항상 허용]</u>으로 풀어주세요.<br>
        2. 각 쇼핑몰들이 폐쇄몰이므로, <u>미리 다른 탭에서 로그인을 해두셔야</u> 검색 결과와 원장님 회원 등급별 특가가 정상적으로 노출됩니다.
    </div>
</div>

<script>
function searchAll() {
    var query = document.getElementById('keyword').value.trim();
    if (!query) {
        alert('검색어를 입력해주세요.');
        return;
    }
    
    // 안전한 검색어 인코딩 처리 (공백 및 한글 깨짐 방지)
    var encodedQuery = encodeURIComponent(query);

    var urls = [
        "https://denall.com" + encodedQuery, // 오스템 덴올
        "https://m-dent.co.kr" + encodedQuery, // 엠덴트
        "https://allof.co.kr" + encodedQuery, // 오브마켓
        "https://dvmall.co.kr" + encodedQuery, // DVmall
        "https://edent.co.kr" + encodedQuery, // 이덴트
        "https://dentalbean.com" + encodedQuery, // 덴탈빈
        "https://dental365.co.kr" + encodedQuery, // 덴탈365
        "https://orthomart.co.kr" + encodedQuery, // 올소마트
        "https://misomall.com" + encodedQuery // 미소몰
    ];

    urls.forEach(function(url) {
        window.open(url, '_blank');
    });
}
</script>

</body>
</html>
